<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #faf9fd;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed-dim": "#f2bc82",
                        "on-tertiary-fixed-variant": "#633f0f",
                        "on-secondary": "#ffffff",
                        "outline": "#74777f",
                        "surface-container-highest": "#e3e2e6",
                        "surface": "#faf9fd",
                        "tertiary-fixed": "#ffddba",
                        "on-tertiary-fixed": "#2b1700",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed": "#dee3e8",
                        "on-secondary-fixed-variant": "#42474c",
                        "tertiary-container": "#4f2e00",
                        "on-error-container": "#93000a",
                        "secondary": "#595f63",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-container": "#c6955e",
                        "on-secondary-container": "#5e6368",
                        "inverse-surface": "#2f3033",
                        "secondary-fixed-dim": "#c2c7cc",
                        "surface-variant": "#e3e2e6",
                        "surface-bright": "#faf9fd",
                        "on-secondary-fixed": "#171c20",
                        "primary-container": "#1a365d",
                        "outline-variant": "#c4c6cf",
                        "on-primary-fixed": "#001b3c",
                        "on-primary-container": "#86a0cd",
                        "on-surface-variant": "#43474e",
                        "primary": "#002045",
                        "primary-fixed-dim": "#adc7f7",
                        "on-surface": "#1a1c1e",
                        "tertiary": "#321b00",
                        "error-container": "#ffdad6",
                        "secondary-container": "#dbe0e5",
                        "error": "#ba1a1a",
                        "surface-container-high": "#e9e7eb",
                        "inverse-primary": "#adc7f7",
                        "on-primary-fixed-variant": "#2d476f",
                        "on-background": "#1a1c1e",
                        "background": "#faf9fd",
                        "surface-tint": "#455f88",
                        "inverse-on-surface": "#f1f0f4",
                        "surface-container": "#efedf1",
                        "surface-dim": "#dad9dd",
                        "primary-fixed": "#d6e3ff",
                        "on-error": "#ffffff",
                        "surface-container-low": "#f4f3f7",
                        "on-primary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "4px",
                        "gutter": "16px",
                        "sm": "12px",
                        "md": "16px",
                        "lg": "24px",
                        "container-padding": "24px",
                        "xl": "32px",
                        "xs": "8px"
                    },
                    "fontSize": {
                        "h1": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                        "h2": ["20px", {"lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "h3": ["18px", {"lineHeight": "24px", "fontWeight": "500"}],
                        "body-md": ["14px", {"lineHeight": "22px", "fontWeight": "400"}],
                        "body-sm": ["12px", {"lineHeight": "18px", "fontWeight": "400"}],
                        "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-surface flex flex-col min-h-screen">
<!-- TopAppBar from Shared Components -->
<header class="bg-white/90 dark:bg-slate-950/90 backdrop-blur-md text-blue-900 dark:text-blue-300 font-inter text-base font-semibold tracking-tight docked full-width top-0 sticky z-50 border-b border-slate-100 dark:border-slate-800 shadow-sm flex justify-between items-center w-full px-4 h-16">
<button class="hover:bg-slate-50 dark:hover:bg-slate-900 rounded-full transition-colors p-2 active:scale-95 duration-200">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="text-xl font-bold text-blue-900 dark:text-white">砷智答</h1>
<button class="hover:bg-slate-50 dark:hover:bg-slate-900 rounded-full transition-colors p-2 active:scale-95 duration-200">
<span class="material-symbols-outlined">delete_sweep</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-grow overflow-y-auto px-lg py-xl flex flex-col gap-lg max-w-4xl mx-auto w-full pb-48">
<!-- User Query Bubble -->
<div class="flex justify-end items-start gap-sm">
<div class="bg-primary-container text-white p-md rounded-xl rounded-tr-none max-w-[80%] shadow-sm">
<p class="font-body-md">请解释地下水中的砷污染及其健康风险。</p>
</div>
<div class="w-10 h-10 rounded-full bg-slate-200 flex items-center justify-center shrink-0 border border-outline-variant">
<span class="material-symbols-outlined text-slate-600">person</span>
</div>
</div>
<!-- AI Response Card -->
<div class="flex items-start gap-sm">
<div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center shrink-0 shadow-sm">
<span class="material-symbols-outlined text-white text-[24px]">smart_toy</span>
</div>
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl shadow-sm flex flex-col overflow-hidden flex-1">
<div class="p-lg flex flex-col gap-md">
<div class="flex flex-col gap-md">
<p class="font-body-md leading-relaxed">
          地下水中的砷污染是一个全球性的公共卫生问题，主要来源于地壳中天然存在的含砷矿物的自然风化和淋滤。
        </p>
<div class="bg-[#FFFAF0] border-l-4 border-[#F6AD55] p-md rounded-r-lg flex gap-md">
<span class="material-symbols-outlined text-[#DD6B20]">warning</span>
<div class="flex flex-col gap-xs">
<span class="text-on-tertiary-fixed font-bold font-body-sm uppercase tracking-wider">毒性风险预警</span>
<p class="font-body-md text-[#633f0f]">
              长期摄入含砷水会导致慢性砷中毒。健康风险包括皮肤损伤（色素沉着、过度角质化）、心血管疾病、糖尿病以及多种癌症（肺癌、膀胱癌、皮肤癌）。
            </p>
</div>
</div>
<p class="font-body-md leading-relaxed">
          砷在自然界中以三价（亚砷酸盐）和五价（砷酸盐）的形式存在，其中三价砷的毒性通常高于五价砷。
        </p>
</div>
<div class="mt-base pt-md border-t border-slate-100 flex flex-col gap-sm">
<button class="flex items-center justify-between w-full p-sm bg-surface-container-low rounded-lg hover:bg-surface-container transition-colors">
<div class="flex items-center gap-xs text-blue-900 font-medium">
<span class="material-symbols-outlined text-[18px]">attach_file</span>
<span class="font-body-sm">来源1：《WHO 砷准则》第 3 章</span>
</div>
<span class="material-symbols-outlined text-secondary">expand_more</span>
</button>
</div>
</div>
<div class="px-lg py-sm bg-slate-50/50 flex justify-between items-center border-t border-slate-100">
<div class="flex items-center gap-sm">
<button class="flex items-center gap-1 px-3 py-1.5 rounded-full hover:bg-slate-200/50 text-secondary transition-all">
<span class="material-symbols-outlined text-[18px]">thumb_up</span>
</button>
<button class="flex items-center gap-1 px-3 py-1.5 rounded-full hover:bg-slate-200/50 text-secondary transition-all">
<span class="material-symbols-outlined text-[18px]">thumb_down</span>
</button>
</div>
<button class="flex items-center gap-2 px-4 py-1.5 rounded-full bg-secondary-container text-primary font-medium font-body-sm hover:bg-slate-200 transition-all">
<span class="material-symbols-outlined text-[16px]">content_copy</span>
<span>复制内容</span>
</button>
</div>
</div>
</div>
</main>
<!-- Bottom Input & Navigation Section -->
<div class="fixed bottom-0 w-full z-50">
<!-- Input Area Background & Blur -->
<div class="bg-white/80 backdrop-blur-xl border-t border-slate-100 px-lg py-md flex flex-col gap-md pb-[80px]">
<!-- Recommendation Chips -->
<div class="flex gap-sm overflow-x-auto pb-1 scrollbar-hide">
<button class="whitespace-nowrap px-md py-1.5 bg-secondary-fixed text-primary rounded-full font-body-sm hover:bg-secondary-fixed-dim transition-colors flex items-center gap-xs">
<span class="material-symbols-outlined text-[14px]">search</span>
<span>水中砷浓度标准？</span>
</button>
<button class="whitespace-nowrap px-md py-1.5 bg-secondary-fixed text-primary rounded-full font-body-sm hover:bg-secondary-fixed-dim transition-colors flex items-center gap-xs">
<span class="material-symbols-outlined text-[14px]">science</span>
<span>如何去除水中的砷？</span>
</button>
</div>
<!-- Text Input Container -->
<div class="relative bg-surface-container-low rounded-xl border border-outline-variant focus-within:border-primary-container focus-within:bg-white transition-all shadow-sm">
<div class="flex items-center px-md py-sm gap-sm">
<button class="p-2 hover:bg-slate-200/50 rounded-full transition-colors text-blue-900" title="知识库快捷搜索">
<span class="material-symbols-outlined">inventory_2</span>
</button>
<textarea class="w-full bg-transparent border-none focus:ring-0 text-body-md py-2 resize-none" placeholder="输入问题或知识库关键词..." rows="1"></textarea>
<button class="bg-primary-container text-white p-2.5 rounded-lg hover:bg-primary transition-all active:scale-95 shadow-md flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">send</span>
</button>
</div>
</div>
</div>
<!-- BottomNavBar from Shared Components -->
<nav class="bg-white dark:bg-slate-950 fixed bottom-0 w-full z-50 rounded-t-xl border-t border-slate-100 dark:border-slate-800 shadow-[0_-4px_12px_rgba(26,54,93,0.05)] flex justify-around items-center w-full px-2 py-3 h-[72px]">
<!-- Item 1: Active -->
<div class="flex flex-col items-center justify-center text-blue-900 dark:text-blue-400 bg-blue-50/50 dark:bg-blue-900/20 rounded-2xl px-3 py-1 transition-transform duration-300 ease-out active:scale-90">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-inter text-[11px] font-medium mt-0.5">首页</span>
</div>
<!-- Item 2 -->
<div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 hover:text-blue-800 dark:hover:text-blue-300 transition-transform duration-300 ease-out active:scale-90">
<span class="material-symbols-outlined">inventory_2</span>
<span class="font-inter text-[11px] font-medium mt-0.5">知识库</span>
</div>
<!-- Item 3 -->
<div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 hover:text-blue-800 dark:hover:text-blue-300 transition-transform duration-300 ease-out active:scale-90">
<span class="material-symbols-outlined">account_tree</span>
<span class="font-inter text-[11px] font-medium mt-0.5">知识图谱</span>
</div>
<!-- Item 4 -->
<div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 hover:text-blue-800 dark:hover:text-blue-300 transition-transform duration-300 ease-out active:scale-90">
<span class="material-symbols-outlined">person</span>
<span class="font-inter text-[11px] font-medium mt-0.5">个人中心</span>
</div>
</nav>
</div>
<!-- Background Decoration -->
<div class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none opacity-20">
<div class="absolute top-[10%] left-[5%] w-64 h-64 bg-blue-100 rounded-full blur-3xl"></div>
<div class="absolute bottom-[20%] right-[10%] w-96 h-96 bg-slate-200 rounded-full blur-3xl"></div>
</div>
</body></html>
